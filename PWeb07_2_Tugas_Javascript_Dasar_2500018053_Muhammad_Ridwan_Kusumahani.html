<!DOCTYPE html>
<html>
<head>
  <title>PWeb-07.2 Tugas Javascript Dasar</title>
</head>
<body>
  <h2>Konversi Nilai Angka ke Huruf</h2>
  <script>
    var nilai = prompt("Masukkan nilai (0-100):", "85");
    var angka = parseInt(nilai);
    var huruf;

    if (isNaN(angka) || angka < 0 || angka > 100) {
      huruf = "Nilai tidak valid";
    } else if (angka >= 0 && angka <= 20) {
      huruf = "E";
    } else if (angka >= 21 && angka <= 39) {
      huruf = "D";
    } else if (angka >= 40 && angka <= 64) {
      huruf = "C";
    } else if (angka >= 65 && angka <= 79) {
      huruf = "B";
    } else if (angka >= 80 && angka <= 100) {
      huruf = "A";
    }

    document.write("<h3>Hasil Evaluasi Nilai</h3>");
    document.write("Nilai angka: " + angka + "<br>");
    document.write("Nilai huruf: " + huruf);
  </script>
</body>
</html>
